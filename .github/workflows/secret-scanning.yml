name: Frontend Secret Scanning & Security Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  secret-scan:
    name: Scan Frontend for Hardcoded Secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for Exposed Secrets or Bundled Credentials
        run: |
          echo "Verifying no private environment files or key materials are committed..."
          if git ls-files | grep -E '^\.env$|\.env\.local$|\.pem$|\.key$|credentials\.json'; then
            echo "CRITICAL: Sensitive environment or credential files detected in git tracking!"
            exit 1
          fi

          echo "Verifying dist artifacts are untracked..."
          if git ls-files | grep -E '^dist/'; then
            echo "CRITICAL: Build artifacts (dist/) tracked in git repository!"
            exit 1
          fi

          echo "Frontend secret audit passed."
